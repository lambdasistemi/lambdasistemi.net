<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Recover access</title>
<style>
  :root { color-scheme: light dark; --fg:#1b1b1f; --bg:#f6f7fb; --card:#fff; --muted:#5f6368; --accent:#1a73e8; --ok:#137333; --bad:#b3261e; --line:#dadce0; --demo:#fef7e0; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8eaed; --bg:#16171a; --card:#202124; --muted:#9aa0a6; --accent:#8ab4f8; --ok:#81c995; --bad:#f28b82; --line:#3c4043; --demo:#3b3320; } }
  * { box-sizing: border-box; }
  body { font: 20px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 16px; }
  main { max-width: 34rem; margin: 1rem auto 3rem; }
  .demo { background: var(--demo); border-radius: 10px; padding: .6rem .9rem; font-size: .8rem; margin-bottom: 1rem; }
  h1 { font-size: 1.6rem; margin: .2rem 0 1rem; }
  .step { display: flex; gap: 1rem; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
  .n { flex: none; width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .step p { margin: .1rem 0 .6rem; }
  .hint { color: var(--muted); font-size: .85rem; margin: 0; }
  button.big, a.big { display: inline-block; font: inherit; font-weight: 600; padding: .9rem 1.4rem; border-radius: 12px; border: 0; background: var(--accent); color: #fff; cursor: pointer; text-decoration: none; }
  button.big[disabled] { opacity: .5; cursor: default; }
  button.quiet { font: inherit; background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 12px; padding: .7rem 1.1rem; cursor: pointer; }
  #msg { min-height: 1.6em; margin-top: .6rem; }
  .ok { color: var(--ok); font-weight: 600; } .bad { color: var(--bad); }
  #keybox { font: 1.05rem ui-monospace, monospace; background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: .7rem .9rem; word-break: break-all; margin: .5rem 0 1rem; }
  .row { display: flex; flex-wrap: wrap; gap: .7rem; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 2rem; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="demo" id="demo"></div>
  <h1 id="title"></h1>

  <div class="step">
    <div class="n">1</div>
    <div><p id="s1"></p><p class="hint" id="h1"></p></div>
  </div>

  <div class="step">
    <div class="n">2</div>
    <div>
      <p id="s2"></p>
      <button class="big" id="go"></button>
      <p class="hint" id="h2"></p>
      <div id="msg" aria-live="polite"></div>
    </div>
  </div>

  <div class="step" id="done" hidden>
    <div class="n">3</div>
    <div>
      <p class="ok" id="okmsg"></p>
      <div id="keybox"></div>
      <div class="row">
        <button class="big" id="copy"></button>
        <a class="big" id="open" href="https://my.1password.com/signin" target="_blank" rel="noopener"></a>
      </div>
      <p class="hint" id="s3"></p>
    </div>
  </div>

  <footer>
    <a href="?lang=en">English</a> · <a href="?lang=it">Italiano</a> ·
    <a href="./" id="adm"></a>
  </footer>
</main>

<script src="box.js"></script>
<script>
const T = {
  en: { demo: 'DEMO: the key shown is fake. Nothing real is stored on this page.',
    title: 'Get back into 1Password',
    s1: 'Plug in your security key.', h1: 'If it does not fit the computer, use the small adapter that comes with it.',
    s2: 'Press the button. Your browser will ask for the key’s PIN. Then touch the key.', go: 'Unlock',
    h2: 'Touch means: put your finger on the key until it answers.',
    wait: 'Waiting for your key…', ok: 'Done!', copy: 'Copy the key', copied: 'Copied ✓',
    open: 'Open 1Password', s3: 'In 1Password: type your email, paste the key, then type your password.',
    adm: 'For whoever set this up',
    e_cancel: 'It was cancelled or took too long. Press Unlock again, and touch the key when it answers.',
    e_nokey: 'This browser or key cannot do this. Try Chrome or Edge, with the key plugged in.',
    e_none: 'Nothing has been set up on this page yet.', e_other: 'Something went wrong: ' },
  it: { demo: 'DEMO: la chiave mostrata è finta. Nessun dato reale è salvato in questa pagina.',
    title: 'Rientra in 1Password',
    s1: 'Inserisci la chiave di sicurezza.', h1: 'Se non entra nel computer, usa il piccolo adattatore in dotazione.',
    s2: 'Premi il pulsante. Il browser chiederà il PIN della chiave. Poi tocca la chiave.', go: 'Sblocca',
    h2: 'Toccare vuol dire appoggiare il dito sulla chiave finché risponde.',
    wait: 'In attesa della chiave…', ok: 'Fatto!', copy: 'Copia la chiave', copied: 'Copiata ✓',
    open: 'Apri 1Password', s3: 'In 1Password: scrivi la tua email, incolla la chiave, poi scrivi la tua password.',
    adm: 'Per chi ha configurato la pagina',
    e_cancel: 'Annullato o troppo lento. Premi di nuovo Sblocca e tocca la chiave quando risponde.',
    e_nokey: 'Questo browser o questa chiave non può farlo. Prova Chrome o Edge, con la chiave inserita.',
    e_none: 'In questa pagina non è ancora stato configurato nulla.', e_other: 'Qualcosa è andato storto: ' }
};
const q = new URLSearchParams(location.search).get('lang');
const lang = T[q] ? q : ((navigator.language || 'en').slice(0, 2) in T ? (navigator.language || 'en').slice(0, 2) : 'en');
const L = T[lang]; document.documentElement.lang = lang;
const $ = (id) => document.getElementById(id);
$('demo').textContent = L.demo; $('demo').hidden = RP !== 'localhost';
$('title').textContent = L.title; document.title = L.title;
$('s1').textContent = L.s1; $('h1').textContent = L.h1; $('s2').textContent = L.s2; $('go').textContent = L.go;
$('h2').textContent = L.h2; $('copy').textContent = L.copy; $('open').textContent = L.open; $('s3').textContent = L.s3; $('adm').textContent = L.adm;
$('adm').href = 'setup.html';
$('go').onclick = async () => {
  const msg = $('msg'); msg.className = ''; msg.textContent = L.wait; $('go').disabled = true; $('done').hidden = true;
  try {
    const box = await loadBox('box.json'); if (!box) { const e = new Error('none'); e.name = 'NoBundle'; throw e; }
    const note = await decryptNote(box, await unlockDataKey(box));
    const m = note.match(SECRET_KEY_RE);
    msg.textContent = ''; $('okmsg').textContent = L.ok; $('keybox').textContent = m ? m[0] : note; $('done').hidden = false;
    $('copy').textContent = L.copy;
    $('copy').onclick = async () => { await navigator.clipboard.writeText(m ? m[0] : note); $('copy').textContent = L.copied; setTimeout(() => navigator.clipboard.writeText(' ').catch(() => {}), 60000); };
  } catch (e) {
    msg.className = 'bad';
    msg.textContent = e.name === 'NoBundle' ? L.e_none
      : (e.name === 'NotAllowedError' || e.name === 'AbortError') ? L.e_cancel
      : (e.name === 'NoPrf' || e.name === 'NotSupportedError' || e.name === 'SecurityError') ? L.e_nokey : L.e_other + (e.message || e.name);
  } finally { $('go').disabled = false; }
};
</script>
</body>
</html>
