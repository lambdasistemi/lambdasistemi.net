name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # epyc runners serve lambdasistemi.net from a local bind mount;
    # the deploy is a plain file sync on the serving host.
    runs-on: [self-hosted, nixos, epyc]
    steps:
      - uses: actions/checkout@v4

      # The runner PATH has no rsync/curl; pull them through nix.
      - name: Sync to production
        run: |
          # -c (checksum) instead of times: prod files may be owned by
          # another user, and a non-owner cannot set times on them.
          nix run nixpkgs#rsync -- -rlcv --delete \
            --exclude='.git*' --exclude='.github' \
            ./ /srv/prod-hot/personal-sites/lambdasistemi/

      - name: Smoke check the live site
        # curl and diff are not on the runner PATH either
        run: |
          nix shell nixpkgs#curl nixpkgs#diffutils --command bash -e -c '
            for p in "" projects.html styles.css logo.svg og.png; do
              curl -sf -o /dev/null "https://lambdasistemi.net/$p"
            done
            curl -s https://lambdasistemi.net/index.html | diff - index.html
          '
